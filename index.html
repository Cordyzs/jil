<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

h1{
    font-size:50px;
    color:#4285F4;
}

input{
    width:320px;
    padding:12px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:25px;
    outline:none;
}

button{
    margin-top:20px;
    padding:12px 30px;
    font-size:18px;
    border:none;
    border-radius:25px;
    background:#4285F4;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#3367D6;
}

#jumpscare{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    z-index:9999;
}

#jumpVideo{
    width:100%;
    height:100%;
    object-fit:cover;
}
</style>
</head>

<body>

<div class="container">
    <h1>Search</h1>

    <input type="text" placeholder="Search anything...">
    <br><br>

    <button id="searchBtn">Enter your number</button>
</div>

<div id="jumpscare">
    <video id="jumpVideo" playsinline preload="auto">
        <source src="jumpscare.mp4" type="video/mp4">
    </video>
</div>

<script>
const btn = document.getElementById("searchBtn");

btn.addEventListener("click", function(){

    document.querySelector(".container").style.display = "none";

    document.getElementById("jumpscare").style.display = "block";

    const video = document.getElementById("jumpVideo");
    video.currentTime = 0;

    video.play().catch(function(err){
        alert("Video couldn't play: " + err);
    });

});
</script>

</body>
</html>
